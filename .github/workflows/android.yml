name: Android APK

on:
  push:
    paths: ["android-copilot/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-copilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Testes
        run: gradle testDebugUnitTest --no-daemon

      - name: APK release
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: radar-corrida-apk
          path: android-copilot/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-testes
          path: android-copilot/app/build/reports/tests/
